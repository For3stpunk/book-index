<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Book Releases Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a bookseller's frontlist rundown, quick and plain-spoken.
   IDEA: the new-release wall: covers face-out, shelved by pub week, with a side rail for browsing.
   PICTURE: a cover wall grouped under week headers, a left browse rail (months, genres, lists, watchlist), a detail drawer on click.
   COLOUR and TYPE: white floor, black ink, one red accent; Archivo for headers, Inter for text. Matches the album/singles finders.
   LAYOUT: header row with stats, search bar, two-column body (rail + wall), modal for a book. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#111214);--card:light-dark(#f6f6f4,#1b1c1f);--ink:light-dark(#121212,#ecebe8);--muted:light-dark(#5f6166,#a3a5ab);
--rule:light-dark(#e3e3df,#2c2e33);--acc:light-dark(#c8102e,#ff6b7d);--acc2:light-dark(#1f4fd6,#7aa0ff);--chip:light-dark(#ececE8,#25272b);
--fd:"Archivo","Helvetica Neue",Arial,sans-serif;--fb:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--fb);overflow-x:clip}
.wrap{max-width:1320px;margin:0 auto;padding:clamp(20px,3vw,40px) max(3vw,16px) 64px;display:grid;gap:20px}
header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 28px;align-items:end;border-bottom:3px solid var(--ink);padding-bottom:16px}
h1{font:800 clamp(30px,4.6vw,50px)/1.05 var(--fd);margin:0;letter-spacing:-.01em;text-wrap:balance}
.lede{margin:8px 0 0;color:var(--muted);max-width:70ch}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:var(--card);border-radius:6px;padding:10px 14px;min-width:96px}
.stat b{display:block;font:800 24px/1.1 var(--fd);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.body{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start}
aside{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;display:grid;gap:18px;padding-right:4px}
aside h3{font:800 12px var(--fd);letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px;color:var(--muted)}
aside ul{list-style:none;margin:0;padding:0;display:grid;gap:1px}
aside button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:8px;width:100%;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:15px}
aside button small{color:var(--muted);font-variant-numeric:tabular-nums}
aside button:hover{background:var(--card)}
aside button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
aside button[aria-pressed=true] small{color:var(--bg);opacity:.75}
aside button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0 10px}
input[type=search],select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:9px 12px;min-height:44px}
input[type=search]{flex:1 1 280px}
.btn{font:500 14px var(--fb);background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:0 14px;min-height:44px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.count{font-size:13px;color:var(--muted);width:100%}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.week{display:grid;gap:12px;margin-bottom:28px}
.week h2{font:800 22px/1.2 var(--fd);margin:0;display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:6px}
.week h2 small{font:500 13px var(--fb);color:var(--muted)}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:18px 14px}
.book{all:unset;cursor:pointer;display:grid;gap:6px;align-content:start;position:relative}
.book:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
.cover{aspect-ratio:2/3;width:100%;border-radius:3px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.35);overflow:hidden;display:grid;place-items:center;text-align:center;padding:0}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.spr{display:block;width:100%;height:100%;background-repeat:no-repeat;background-size:1000% var(--rows)}
.cover .ph{padding:12px;font:700 14px/1.2 var(--fd);color:var(--muted)}
@media(prefers-reduced-motion:no-preference){.book .cover{transition:transform .14s}.book:hover .cover{transform:translateY(-3px)}}
.book b{font:700 14px/1.25 var(--fd);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book span{font-size:13px;color:var(--muted);line-height:1.3;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.cell{position:relative;display:grid}
.cell>.book{width:100%}
.save{position:absolute;top:4px;right:4px;width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.92);color:#121212;font-size:20px;line-height:1;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.save[aria-pressed=true]{background:var(--acc);color:#fff}
.save:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.flags{position:absolute;top:6px;left:6px;display:flex;gap:4px;flex-wrap:wrap}
.flag{font:700 11px var(--fb);background:var(--acc);color:#fff;border-radius:3px;padding:1px 6px}
.flag.w{background:var(--ink);color:var(--bg)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.more{justify-self:center}
dialog{border:0;border-radius:10px;padding:0;max-width:min(860px,94vw);width:100%;background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dl{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px;padding:24px}
.dl .cover{box-shadow:0 2px 10px rgba(0,0,0,.3)}
.dl h2{font:800 28px/1.1 var(--fd);margin:0}
.dl .sub{font-size:17px;color:var(--muted);margin:4px 0 0}
.dl .by{font-size:17px;margin:8px 0}
.dl .facts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--muted);margin:0 0 12px}
.dl .desc{font-size:15px;line-height:1.6;max-height:42vh;overflow:auto}
.dl .desc p{margin:0 0 .8em}
.dl .news{border-top:1px solid var(--rule);margin-top:12px;padding-top:10px;font-size:14px}
.dl .news a,.dl .facts a{color:var(--ink)}
.dl .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.dl .acts a{display:inline-flex;align-items:center;text-decoration:none}
.x{position:absolute;top:8px;right:10px;width:44px;height:44px;border:0;background:transparent;color:var(--ink);font-size:26px;cursor:pointer}
footer{font-size:13px;color:var(--muted);max-width:85ch;border-top:1px solid var(--rule);padding-top:14px}
#msg{font-size:13px;color:var(--muted)}
.railtoggle{display:none}
@media(max-width:820px){.body{grid-template-columns:minmax(0,1fr)}aside{position:static;max-height:none;display:none}aside.open{display:grid}.railtoggle{display:inline-block}header{grid-template-columns:minmax(0,1fr)}.dl{grid-template-columns:minmax(0,1fr)}.dl .cover{max-width:180px}.wall{grid-template-columns:repeat(auto-fill,minmax(108px,1fr))}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div><h1 id="h1"></h1><p class="lede" id="lede"></p></div>
<section class="stats" id="stats" aria-label="Summary"></section>
</header>
<div class="body">
<aside id="rail" aria-label="Browse"></aside>
<main>
<div class="bar">
<button class="btn railtoggle" id="railbtn" type="button" aria-expanded="false">Browse</button>
<label for="q" style="position:absolute;left:-9999px">Search</label>
<input type="search" id="q" placeholder="Search title, author, publisher or category">
<label for="sort" style="position:absolute;left:-9999px">Sort</label>
<select id="sort"><option value="date">By pub week</option><option value="title">Title A–Z</option><option value="author">Author A–Z</option></select>
<button class="btn" id="copy" type="button">Copy watchlist</button><button class="btn" id="dlw" type="button">Download watchlist</button>
<span class="count" id="count" aria-live="polite"></span><span id="msg" role="status"></span>
</div>
<section id="list" aria-label="Books"></section>
<button class="btn more" id="more" type="button" hidden>Show more</button>
</main>
</div>
<footer id="foot"></footer>
</div>
<dialog id="dlg" aria-labelledby="dt"><div style="position:relative"><button class="x" id="dx" type="button" aria-label="Close">×</button><div id="dbody"></div></div></dialog>
<script type="application/json" id="cfg">__CFG__</script>
<script type="application/json" id="data">__DATA__</script>
<script>
{
const C=JSON.parse(document.getElementById('cfg').textContent);
const D=JSON.parse(document.getElementById('data').textContent);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(){try{return JSON.parse(localStorage.getItem(C.storeKey)||'[]')}catch(e){return []}},set(v){try{localStorage.setItem(C.storeKey,JSON.stringify(v))}catch(e){}}};
let watch=new Set(store.get());
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const fmtD=s=>{const d=pd(s);return `${MON[d.getUTCMonth()].slice(0,3)} ${d.getUTCDate()}, ${d.getUTCFullYear()}`};
const weekOf=s=>{const d=pd(s);const off=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-off);return d.toISOString().slice(0,10)};
const tue=w=>{const d=pd(w);d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10)};
const SP=C.sprites||[];
const IMG=cv=>{if(!cv||!SP[cv[0]])return '';const[s,c]=cv;const sh=SP[s];const rows=sh[1];const col=c%10,row=Math.floor(c/10);return `background-image:url(${sh[0]});--rows:${rows*100}%;background-position:${col/9*100}% ${rows>1?row/(rows-1)*100:0}%`};
const DS={};const getDesc=async b=>{if(!(b.ds in DS)){DS[b.ds]=fetch('desc/'+String(b.ds).padStart(2,'0')+'.json').then(r=>r.ok?r.json():{}).catch(()=>({}))}return (await DS[b.ds])[b.ean]};
const B=D.map((r,i)=>({...r,img:IMG(r.cv),i,wk:r.tba?'9999-'+r.d.slice(0,7):weekOf(r.d),mo:r.d.slice(0,7),hay:[r.t,r.st,r.a,r.pub,r.bisac,r.g].join(' ').toLowerCase()}));
const today=C.today;
document.title=C.title;$('h1').textContent=C.h1;$('lede').innerHTML=C.lede;$('foot').innerHTML=C.foot;
const stats=[[B.length,'books'],[new Set(B.map(b=>b.wk)).size,'weeks'],[B.filter(b=>b.news&&b.news.length).length,'in the news'],[new Set(B.map(b=>b.pub)).size,'imprints']];
$('stats').innerHTML=stats.map(([n,l])=>`<div class="stat"><b>${n.toLocaleString('en-US')}</b><span>${l}</span></div>`).join('');
/* rail */
const cnt=(f)=>B.filter(f).length;
const thisWk=weekOf(today);
const lists=[['all','All upcoming',()=>true],['week','Out this week',b=>b.wk===thisWk],...(B.some(b=>b.isNew)?[['new','Recent additions',b=>b.isNew]]:[]),['news','In the news',b=>b.news&&b.news.length],['lgbt','LGBTQ+ reads',b=>b.lgbt],['watch','My watchlist',b=>watch.has(b.ean)]];
const months=[...new Set(B.map(b=>b.mo))].sort();
const gc={};B.forEach(b=>gc[b.g]=(gc[b.g]||0)+1);
const genres=Object.keys(gc).sort((a,b)=>a==='Other'?1:b==='Other'?-1:a.localeCompare(b));
const SRCN={E:'Edelweiss',PW:'Publishers Weekly',K:'Kirkus',BR:'Book Riot',AZ:'Amazon',P:'Publisher site',A:'Author site'};
const SRC=Object.entries(SRCN).filter(([v])=>D.some(r=>(r.src||['E']).includes(v)));
const AUD=[['Adult','Adult'],['YA','Young adult'],['Kids',"Children's"]];
const st={list:'all',mo:null,g:null,au:null,sr:null,q:'',sort:'date',limit:240};
function rail(){
 const li=(k,v,label,n)=>`<li><button type="button" data-k="${k}" data-v="${esc(v)}" aria-pressed="${(k==='list'&&st.list===v)||(k==='mo'&&st.mo===v)||(k==='g'&&st.g===v)||(k==='au'&&st.au===v)||(k==='sr'&&st.sr===v)}">${esc(label)}<small>${n}</small></button></li>`;
 $('rail').innerHTML=`<div><h3>Browse</h3><ul>${lists.map(([v,l,f])=>li('list',v,l,cnt(f))).join('')}</ul></div>
 <div><h3>Month</h3><ul>${months.map(m=>{const[y,mm]=m.split('-');return li('mo',m,`${MON[+mm-1]} ${y}`,cnt(b=>b.mo===m))}).join('')}</ul></div>
${SRC.length>1?`<div><h3>Sources</h3><ul>${SRC.map(([v,l])=>li('sr',v,l,cnt(b=>(b.src||['E']).includes(v)))).join('')}${B.some(b=>b.pwStar)?li('sr','PW*','PW starred review',cnt(b=>b.pwStar)):''}</ul></div>`:''}
 <div><h3>Audience</h3><ul>${AUD.map(([v,l])=>li('au',v,l,cnt(b=>b.aud===v))).join('')}</ul></div>
 <div><h3>Genre</h3><ul>${genres.map(g=>li('g',g,g,gc[g])).join('')}</ul></div>`;
}
rail();
$('rail').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k,v=b.dataset.v;
 if(k==='list'){st.list=v}else{st[k]=st[k]===v?null:v}st.limit=240;rail();render();});
$('railbtn').addEventListener('click',()=>{const o=$('rail').classList.toggle('open');$('railbtn').setAttribute('aria-expanded',String(o))});
$('q').addEventListener('input',e=>{st.q=e.target.value;st.limit=240;render()});
$('sort').addEventListener('change',e=>{st.sort=e.target.value;render()});
$('more').addEventListener('click',()=>{st.limit+=240;render()});
function current(){
 const q=st.q.trim().toLowerCase();const lf=lists.find(l=>l[0]===st.list)[2];
 const rows=B.filter(b=>lf(b)&&(!st.mo||b.mo===st.mo)&&(!st.g||b.g===st.g)&&(!st.au||b.aud===st.au)&&(!st.sr||(st.sr==='PW*'?b.pwStar:(b.src||['E']).includes(st.sr)))&&(!q||b.hay.includes(q)));
 const s={date:(a,b)=>a.d.localeCompare(b.d)||(b.news?.length||0)-(a.news?.length||0)||a.t.localeCompare(b.t),title:(a,b)=>a.t.localeCompare(b.t),author:(a,b)=>a.a.localeCompare(b.a)}[st.sort];
 return rows.sort(s);
}
const card=b=>{const w=watch.has(b.ean);return `<div class="cell"><button type="button" class="book" data-i="${b.i}" aria-label="${esc(b.t)} by ${esc(b.a)}"><div class="cover">${b.img?`<i class="spr" style="${b.img}"></i>`:`<div class="ph">${esc(b.t)}</div>`}</div><span class="flags">${b.pwStar?'<em class="flag">★ PW</em>':''}${b.news&&b.news.length?'<em class="flag">In the news</em>':''}</span><b>${esc(b.t)}</b><span>${esc(b.a)}</span></button><button type="button" class="save" data-e="${esc(b.ean)}" aria-pressed="${w}" aria-label="${w?'Remove from':'Save to'} watchlist: ${esc(b.t)}">${w?'★':'☆'}</button></div>`};
function render(){
 const rows=current();const shown=rows.slice(0,st.limit);
 $('count').textContent=`Showing ${shown.length.toLocaleString()} of ${rows.length.toLocaleString()} books`;
 if(!rows.length){$('list').innerHTML='<div class="empty">Nothing matches. Clear the search or pick another shelf.</div>';$('more').hidden=true;return}
 if(st.sort==='date'){
  const g={},wc={};rows.forEach(b=>wc[b.wk]=(wc[b.wk]||0)+1);shown.forEach(b=>(g[b.wk]=g[b.wk]||[]).push(b));
  $('list').innerHTML=Object.keys(g).sort().map(w=>`<section class="week"><h2>${w.startsWith('9999')?'Date to be confirmed':'Week of '+fmtD(tue(w))} <small>${wc[w].toLocaleString()} books${w===thisWk?' · this week':''}${g[w].length<wc[w]?` · showing ${g[w].length}`:''}</small></h2><div class="wall">${g[w].map(card).join('')}</div></section>`).join('');
 }else $('list').innerHTML=`<div class="wall">${shown.map(card).join('')}</div>`;
 $('more').hidden=rows.length<=st.limit;
}
function open(b){
 const w=watch.has(b.ean);
 $('dbody').innerHTML=`<div class="dl"><div class="cover">${b.img?`<i class="spr" role="img" aria-label="Cover of ${esc(b.t)}" style="${b.img}"></i>`:`<div class="ph">${esc(b.t)}</div>`}</div>
 <div><h2 id="dt">${esc(b.t)}</h2>${b.st?`<p class="sub">${esc(b.st)}</p>`:''}<p class="by">${esc(b.a)}</p>
 <p class="facts"><span>${b.tba?MON[+b.d.slice(5,7)-1]+" "+b.d.slice(0,4):fmtD(b.d)}</span><span>${esc(b.pub)}</span>${b.fmt?`<span>${esc(b.fmt)}</span>`:''}${b.pages?`<span>${esc(b.pages)} pages</span>`:''}<span>${esc(b.g)}</span></p>
 ${b.bisac?`<p class="facts"><span>${esc(b.bisac)}</span></p>`:''}
 <p class="facts"><span>Listed by: ${(b.src||['E']).map(c=>c==='PW'&&b.pwUrl?`<a href="${esc(b.pwUrl)}" target="_blank" rel="noopener">${SRCN[c]}${b.pwStar?' (starred)':''}</a>`:esc(SRCN[c]||c)).join(' · ')}</span>${b.tba?'<span>Exact date to be confirmed</span>':''}</p>
 <div class="desc" id="ddesc"><p>Loading the description…</p></div>
 ${b.brPosts&&b.brPosts.length?`<div class="news"><b>On Book Riot</b><ul>${b.brPosts.map(p=>`<li><a href="${esc(p.u)}" target="_blank" rel="noopener">${esc(p.t)}</a></li>`).join('')}</ul></div>`:''}
 ${b.news&&b.news.length?`<div class="news"><b>In the news</b><ul>${b.news.map(n=>`<li><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a> · ${esc(n.source)}, ${esc(n.date)}</li>`).join('')}</ul></div>`:''}
 <div class="acts"><button type="button" class="btn" id="wbtn" aria-pressed="${w}">${w?'★ On your watchlist':'☆ Add to watchlist'}</button>
 <a class="btn" href="https://www.edelweiss.plus/#sku=${esc(b.ean)}&page=1" target="_blank" rel="noopener">Edelweiss</a>
 <a class="btn" href="https://bookshop.org/a/0/${esc(b.ean)}" target="_blank" rel="noopener">Bookshop</a></div></div></div>`;
 $('wbtn').onclick=()=>{watch.has(b.ean)?watch.delete(b.ean):watch.add(b.ean);store.set([...watch]);open(b);rail();render()};
 if(!$('dlg').open)$('dlg').showModal();
 getDesc(b).then(h=>{const el=$('ddesc');if(el&&$('dt').textContent===b.t)el.innerHTML=h||'<p>No description from the publisher yet.</p>'});
}
$('list').addEventListener('click',e=>{const sv=e.target.closest('.save');if(sv){const k=sv.dataset.e;watch.has(k)?watch.delete(k):watch.add(k);store.set([...watch]);const on=watch.has(k);sv.setAttribute('aria-pressed',String(on));sv.textContent=on?'★':'☆';$('msg').textContent=on?'Saved to your watchlist.':'Removed from your watchlist.';rail();if(st.list==='watch')render();return}const c=e.target.closest('.book');if(c)open(B[+c.dataset.i])});
$('dx').onclick=()=>$('dlg').close();
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))$('dlg').close()});
$('copy').addEventListener('click',async()=>{const L=B.filter(b=>watch.has(b.ean)).sort((a,b)=>a.d.localeCompare(b.d)).map(b=>`${b.d} | ${b.t} | ${b.a} | ${b.pub}`);if(!L.length){$('msg').textContent='Your watchlist is empty: open a book and add it.';return}try{await navigator.clipboard.writeText(L.join('\n'));$('msg').textContent=`Copied ${L.length} books.`}catch(e){$('msg').textContent='Copy was blocked by the browser.'}});
$('dlw').addEventListener('click',async()=>{const L=B.filter(b=>watch.has(b.ean)).sort((a,b)=>a.d.localeCompare(b.d));if(!L.length){$('msg').textContent='Your watchlist is empty: tap ☆ on a cover to save it.';return}
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\ufeff'+['Pub date,Title,Author,Publisher,Format,Genre,ISBN'].concat(L.map(b=>[b.d,b.t+(b.st?': '+b.st:''),b.a,b.pub,b.fmt,b.g,b.ean].map(q).join(','))).join('\r\n');
 try{const dl=await claude.use('downloads');if(!dl){$('msg').textContent='Downloads aren\'t available here; use Copy watchlist.';return}await dl.save({filename:'book-watchlist.csv',data:new Blob([csv],{type:'text/csv'})});$('msg').textContent=`Saved ${L.length} books as a CSV.`}catch(e){$('msg').textContent='The download was blocked; use Copy watchlist instead.'}});
render();
}
</script>
</body>
</html>
