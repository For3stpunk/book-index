name: collect

on:
  schedule:
    - cron: '23 12 * * 1'   # Mondays 04:23 PT: weekly sweep
    - cron: '41 11 1 * *'   # 1st of the month 03:41 PT: monthly master
  workflow_dispatch:
    inputs:
      what:
        description: 'probe | discover | pw | publishers | authors | all'
        default: 'all'

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python collect.py "${{ github.event.inputs.what || 'all' }}"
      - name: Commit data
        run: |
          git config user.name "book-index bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "collect: ${{ github.event.inputs.what || 'all' }} $(date -u +%F)" || echo "nothing new"
          for i in 1 2 3; do git pull --rebase -X ours origin main && git push && break; sleep 5; done
